name: Build and publish changed data-products

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-data-products-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build ZIPs and publish to S3
    runs-on: ubuntu-latest
    environment: data-product-production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DATA_PRODUCT_BUCKET: ${{ vars.DATA_PRODUCT_BUCKET }}
      DATA_PRODUCT_PREFIX: ${{ vars.DATA_PRODUCT_PREFIX || 'data-products' }}

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate CI configuration
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo "Missing GitHub variable AWS_REGION" >&2; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "Missing GitHub variable AWS_ROLE_ARN" >&2; exit 1; }
          test -n "$DATA_PRODUCT_BUCKET" || { echo "Missing GitHub variable DATA_PRODUCT_BUCKET" >&2; exit 1; }

      - name: Detect changed data-products
        id: changes
        shell: bash
        run: |
          products=$(./scripts/changed-products.sh "${{ github.event.before }}" "${{ github.sha }}")
          if [[ -n "$products" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'Changed data-products:\n%s\n' "$products"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data-products changed."
          fi

      - name: Build changed data-products
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: ./scripts/build-changed-products.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Retain ZIPs as GitHub run artifacts
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-products-${{ github.sha }}
          path: target/data-product-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Configure short-lived AWS credentials
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: data-products-${{ github.run_id }}

      - name: Publish immutable artifacts to S3
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: ./scripts/publish-artifacts-to-s3.sh target/data-product-artifacts "$DATA_PRODUCT_BUCKET" "$DATA_PRODUCT_PREFIX"
