name: Build and publish changed data-products

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base-sha:
        description: Commit before the product changes
        required: true
        type: string
      target-sha:
        description: Commit containing the releases (defaults to selected ref)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-data-products-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build ZIPs and publish to S3
    runs-on: ubuntu-latest
    environment: data-product-production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DATA_PRODUCT_BUCKET: ${{ vars.DATA_PRODUCT_BUCKET }}
      DATA_PRODUCT_PREFIX: ${{ vars.DATA_PRODUCT_PREFIX || 'data-products' }}

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate CI configuration
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo "Missing GitHub variable AWS_REGION" >&2; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "Missing GitHub variable AWS_ROLE_ARN" >&2; exit 1; }
          test -n "$DATA_PRODUCT_BUCKET" || { echo "Missing GitHub variable DATA_PRODUCT_BUCKET" >&2; exit 1; }

      - name: Resolve comparison commits
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base-sha }}
          DISPATCH_TARGET: ${{ inputs.target-sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BASE"
            target="$CURRENT_SHA"
          else
            base="$DISPATCH_BASE"
            target="${DISPATCH_TARGET:-$CURRENT_SHA}"
          fi
          git rev-parse --verify "${base}^{commit}" >/dev/null
          git rev-parse --verify "${target}^{commit}" >/dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Comparing $base -> $target"

      - name: Detect changed data-products
        id: changes
        shell: bash
        run: |
          products=$(bash ./scripts/changed-products.sh "${{ steps.revisions.outputs.base }}" "${{ steps.revisions.outputs.target }}")
          if [[ -n "$products" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'Changed data-products:\n%s\n' "$products"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data-products changed."
          fi

      - name: Build changed data-products
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: bash ./scripts/build-changed-products.sh "${{ steps.revisions.outputs.base }}" "${{ steps.revisions.outputs.target }}"

      - name: Retain ZIPs as GitHub run artifacts
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-products-${{ steps.revisions.outputs.target }}
          path: target/data-product-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Configure short-lived AWS credentials
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: data-products-${{ github.run_id }}

      - name: Publish immutable artifacts to S3
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: bash ./scripts/publish-artifacts-to-s3.sh target/data-product-artifacts "$DATA_PRODUCT_BUCKET" "$DATA_PRODUCT_PREFIX"
